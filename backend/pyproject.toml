[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelvoice"
version = "0.1.0"
description = "Local-first Voice AI SRE for GPU inference infrastructure"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.1,<2",
  "silero-vad>=5.1,<7",
  "soundfile>=0.12,<1",
  "kokoro>=0.9.4,<1",
  "misaki[en]>=0.9,<1",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
